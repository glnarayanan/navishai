apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "navishai.fullname" . }}-web
  labels:
    {{- include "navishai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: database-prepare
          image: {{ include "navishai.image" .Values.image.rails }}
          imagePullPolicy: {{ .Values.image.rails.pullPolicy }}
          command: ["bin/rails", "db:prepare"]
          envFrom:
            - configMapRef: { name: {{ include "navishai.fullname" . }} }
            - secretRef: { name: {{ .Values.applicationSecret }} }
      containers:
        - name: web
          image: {{ include "navishai.image" .Values.image.rails }}
          imagePullPolicy: {{ .Values.image.rails.pullPolicy }}
          command: ["bin/rails", "server", "-b", "0.0.0.0"]
          envFrom:
            - configMapRef: { name: {{ include "navishai.fullname" . }} }
            - secretRef: { name: {{ .Values.applicationSecret }} }
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /up, port: http, scheme: HTTP }
          livenessProbe:
            httpGet: { path: /up, port: http, scheme: HTTP }
            initialDelaySeconds: 20
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
            - { name: runner-tls, mountPath: /run/navishai/runner-ca.crt, subPath: ca.crt, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: {{ include "navishai.fullname" . }}-rails }
        - name: runner-tls
          secret: { secretName: {{ .Values.runnerTlsSecret }} }
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
