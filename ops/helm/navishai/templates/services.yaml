apiVersion: v1
kind: Service
metadata:
  name: {{ include "navishai.fullname" . }}
  labels:
    {{- include "navishai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "navishai.fullname" . }}-runner
  labels:
    {{- include "navishai.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runner
  ports:
    - name: https
      port: 8081
      targetPort: https
