services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "${NAVISHAI_PUBLIC_LISTEN_ADDRESS:?set NAVISHAI_PUBLIC_LISTEN_ADDRESS}:80:80"
      - "${NAVISHAI_PUBLIC_LISTEN_ADDRESS:?set NAVISHAI_PUBLIC_LISTEN_ADDRESS}:443:443"
    environment:
      NAVISHAI_APP_HOST: ${NAVISHAI_APP_HOST:?set NAVISHAI_APP_HOST}
    volumes:
      - ./ops/installer/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:
