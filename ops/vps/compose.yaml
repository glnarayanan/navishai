# Managed VPS override. Always use with the base compose.yaml and the gated CLI.
x-runtime: &runtime
  image: ${VPS_IMAGE:?set the reviewed image}
  restart: "no"
  network_mode: service:app-net
  labels:
    com.navishai.owner: navishai-reset
  depends_on: !override
    app-net:
      condition: service_started
    postgres:
      condition: service_healthy
services:
  # The CLI runs its own gated preparation as a different owner (vps_prepare).
  prepare:
    profiles: [vps-cli-disabled]
  postgres:
    # The gated CLI only pulls, records and restores pinned upstream digests
    # (vps_pull_pins, recovery images), so it keeps the official image instead
    # of building the base file's db/Dockerfile.
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    build: !reset null
    restart: "no"
    labels:
      com.navishai.owner: navishai-reset
    environment:
      POSTGRES_USER: navishai_admin
      NAVISHAI_PREPARE_PASSWORD: ${NAVISHAI_PREPARE_PASSWORD:?set a distinct owner password}
    volumes: !override
      - lab_postgres18_data:/var/lib/postgresql
      - ./ops/vps/initialize_roles.sh:/docker-entrypoint-initdb.d/10-navishai-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U navishai_admin -d navishai_lab_production"]
  app-net:
    image: ${VPS_IMAGE:?set the reviewed image}
    restart: "no"
    command: [sleep, infinity]
    user: "1000:1000"
    environment: !reset {}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      com.navishai.owner: navishai-reset
    networks: [control, edge]
    ports: ["127.0.0.1:3000:3000"]
  web:
    <<: *runtime
    networks: !reset null
    ports: !reset []
  jobs:
    <<: *runtime
    networks: !reset null
  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: "no"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    labels:
      com.navishai.owner: navishai-reset
    environment:
      NAVISHAI_APP_HOST: ${NAVISHAI_APP_HOST:?set the public host}
      NAVISHAI_ACME_EMAIL: ${NAVISHAI_ACME_EMAIL:?set the certificate contact}
    ports:
      - "${VPS_PUBLIC_LISTEN_ADDRESS:?CLI must derive the host ingress address}:80:80"
      - "${VPS_PUBLIC_LISTEN_ADDRESS:?CLI must derive the host ingress address}:443:443"
      # Direct local HTTPS still verifies the real certificate and hostname.
      - "127.0.0.1:443:443"
    volumes:
      - ./ops/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [control, edge]
volumes:
  # The PostgreSQL 16 volume (lab_postgres_data) is deliberately not declared:
  # it stays untouched after migration and is never created on new installs.
  lab_postgres18_data:
    labels:
      com.navishai.owner: navishai-reset
  rails_storage:
    labels:
      com.navishai.owner: navishai-reset
  caddy_data:
    labels:
      com.navishai.owner: navishai-reset
  caddy_config:
    labels:
      com.navishai.owner: navishai-reset
networks:
  control:
    labels:
      com.navishai.owner: navishai-reset
  edge:
    enable_ipv6: true
    labels:
      com.navishai.owner: navishai-reset
