name: navishai-lab
x-rails: &rails
  build: .
  image: navishai-lab:local
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    RAILS_ENV: production
    NAVISHAI_APP_HOST: ${NAVISHAI_APP_HOST:?set NAVISHAI_APP_HOST}
    NAVISHAI_DATABASE_HOST: postgres
    NAVISHAI_DATABASE_PASSWORD: ${NAVISHAI_DATABASE_PASSWORD:?set NAVISHAI_DATABASE_PASSWORD}
    SECRET_KEY_BASE: ${NAVISHAI_SECRET_KEY_BASE:?set NAVISHAI_SECRET_KEY_BASE}
    NAVISHAI_BOOTSTRAP_TOKEN: ${NAVISHAI_BOOTSTRAP_TOKEN:-}
    NAVISHAI_BOOTSTRAP_TOKEN_EXPIRES_AT: ${NAVISHAI_BOOTSTRAP_TOKEN_EXPIRES_AT:-}
    NAVISHAI_EVALUATION_ENDPOINTS: ${NAVISHAI_EVALUATION_ENDPOINTS:-[]}
    NAVISHAI_SCENARIO_ENDPOINTS: ${NAVISHAI_SCENARIO_ENDPOINTS:-[]}
    NAVISHAI_CORPUS_ENDPOINTS: ${NAVISHAI_CORPUS_ENDPOINTS:-[]}
    NAVISHAI_MATCHING_ENDPOINTS: ${NAVISHAI_MATCHING_ENDPOINTS:-[]}
    NAVISHAI_IMPACT_ENDPOINTS: ${NAVISHAI_IMPACT_ENDPOINTS:-[]}
    NAVISHAI_TRACE_DISCOVERY_ENDPOINTS: ${NAVISHAI_TRACE_DISCOVERY_ENDPOINTS:-[]}
    NAVISHAI_OIDC_ISSUER: ${NAVISHAI_OIDC_ISSUER:-}
    NAVISHAI_OIDC_CLIENT_ID: ${NAVISHAI_OIDC_CLIENT_ID:-}
    NAVISHAI_OIDC_CLIENT_SECRET: ${NAVISHAI_OIDC_CLIENT_SECRET:-}
    NAVISHAI_SYSTEM_SMTP_ADDRESS: ${NAVISHAI_SYSTEM_SMTP_ADDRESS:-}
    NAVISHAI_SYSTEM_SMTP_PORT: ${NAVISHAI_SYSTEM_SMTP_PORT:-}
    NAVISHAI_SYSTEM_SMTP_USER_NAME: ${NAVISHAI_SYSTEM_SMTP_USER_NAME:-}
    NAVISHAI_SYSTEM_SMTP_PASSWORD: ${NAVISHAI_SYSTEM_SMTP_PASSWORD:-}
    NAVISHAI_SYSTEM_SMTP_FROM: ${NAVISHAI_SYSTEM_SMTP_FROM:-}
  depends_on:
    postgres:
      condition: service_healthy
    prepare:
      condition: service_completed_successfully
  networks: [control, edge]
  volumes: [rails_storage:/rails/storage]
services:
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    environment:
      POSTGRES_USER: navishai_setup
      POSTGRES_PASSWORD: ${NAVISHAI_POSTGRES_PASSWORD:?set a distinct NAVISHAI_POSTGRES_PASSWORD}
      POSTGRES_DB: navishai_lab_production
      NAVISHAI_DATABASE_PASSWORD: ${NAVISHAI_DATABASE_PASSWORD:?set NAVISHAI_DATABASE_PASSWORD}
    volumes:
      - lab_postgres_data:/var/lib/postgresql/data
      - ./db/initialize_runtime_role.sh:/docker-entrypoint-initdb.d/10-navishai-runtime.sh:ro
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U navishai_setup -d navishai_lab_production"]
      interval: 5s
      timeout: 5s
      retries: 20
  # One-shot owner preparation before every web/jobs start; the only Rails
  # container with the preparation password. Web/jobs never prepare themselves.
  prepare:
    <<: *rails
    restart: "no"
    command: [bin/rails, db:prepare, db:grant_runtime]
    environment:
      RAILS_ENV: production
      NAVISHAI_APP_HOST: ${NAVISHAI_APP_HOST:?set NAVISHAI_APP_HOST}
      NAVISHAI_DATABASE_HOST: postgres
      NAVISHAI_DATABASE_USERNAME: navishai_setup
      NAVISHAI_DATABASE_PASSWORD: ${NAVISHAI_POSTGRES_PASSWORD:?set a distinct NAVISHAI_POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${NAVISHAI_SECRET_KEY_BASE:?set NAVISHAI_SECRET_KEY_BASE}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    volumes: []
  web:
    <<: *rails
    command: [bin/rails, server, -b, 0.0.0.0]
    ports: ["127.0.0.1:3000:3000"]
    # Explicit, not only inherited: tools that rewrite a routed service's
    # networks ignore YAML-merge-inherited keys and would drop control.
    networks: [control, edge]
  jobs:
    <<: *rails
    command: [bin/jobs]
volumes:
  lab_postgres_data:
  rails_storage:
networks:
  control:
    internal: true
  edge:
