#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  sync_intercom_help_centers:
    command: "IntercomHelpCenterSyncJob.enqueue_due"
    schedule: every day at 12:45am
  recalculate_account_health:
    command: "AccountHealthScheduledRecalculationJob.enqueue_due"
    schedule: every day at 1:30am
  expire_workspace_content:
    command: "Workspace.active.includes(:workspace_data_policy).find_each { |workspace| WorkspaceContentExpiry.request!(workspace:) if workspace.workspace_data_policy.content_retention_days }"
    schedule: every day at 2:30am
  expire_workspace_audit:
    command: "Workspace.active.includes(:workspace_data_policy).find_each { |workspace| WorkspaceDataGovernance.request_audit_expiry!(workspace:) if workspace.workspace_data_policy.audit_retention_days }"
    schedule: every day at 3am
